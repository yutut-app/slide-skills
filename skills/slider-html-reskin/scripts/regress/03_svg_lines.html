<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"/><title>回帰: svg の線</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Verdana','Meiryo',sans-serif}
.slide{width:1280px;height:720px;position:relative;background:#fff}
.bone{left:100px;top:100px;width:800px;height:400px;position:absolute}
.chart{left:100px;top:520px;width:400px;height:150px;position:absolute}
</style></head><body><div class="slide">
<!-- 作図: 線を写す（実線・破線・矢印つき・折れ線） -->
<svg class="bone" data-figure="特性要因図" viewBox="0 0 800 400">
  <line x1="0" y1="200" x2="800" y2="200" stroke="#1F4E79" stroke-width="3"/>
  <line x1="200" y1="80" x2="300" y2="200" stroke="#4472C4" stroke-width="2"/>
  <line x1="500" y1="320" x2="600" y2="200" stroke="#4472C4" stroke-width="2"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#C00000" stroke-width="2" stroke-dasharray="7,5"/>
  <line x1="650" y1="200" x2="790" y2="200" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="50,350 150,300 250,330 350,280" stroke="#808080" stroke-width="2"/>
</svg>
<!-- グラフ: 写さずテンプレートへ送る -->
<svg class="chart" data-figure="パレート図" viewBox="0 0 400 150">
  <line x1="0" y1="150" x2="400" y2="150" stroke="#000"/>
</svg>
</div></body></html>
