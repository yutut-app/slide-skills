<!doctype html>
<meta charset="utf-8">
<meta name="px-per-pt" content="1.333333">
<title>線と文字の重なり</title>
<style>
.slide { width: 1280px; height: 720px; position: relative; font-family: Verdana, Meiryo; }
.lbl  { position: absolute; font-size: 20px; height: 30px; }
.a { left: 100px; top: 185px; width: 200px; }   /* ❌ 線が文字の真ん中を通る。**拾われるべき** */
.b { left: 100px; top: 400px; width: 200px; }   /* ⭕️ 線は文字の下を通る。**拾われてはいけない** */
svg { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
</style>
<section class="slide">
  <div class="lbl a">重なる文字</div>
  <div class="lbl b">離れた文字</div>
  <svg viewBox="0 0 1280 720">
    <line x1="60" y1="200" x2="600" y2="200" stroke="#008096" stroke-width="2"/>
    <line x1="60" y1="460" x2="600" y2="460" stroke="#008096" stroke-width="2"/>
  </svg>
</section>
