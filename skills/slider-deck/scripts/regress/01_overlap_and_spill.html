<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"/><title>重なり</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Verdana','Meiryo',sans-serif}
.slide{width:1280px;height:720px;position:relative;background:#fff}
.tb{position:absolute;padding:4.8px 9.6px}
.a{left:100px;top:200px;width:600px;height:80px}
.a p{font-size:32px;line-height:1.2;color:#000}
.b{left:300px;top:220px;width:600px;height:80px}
.b p{font-size:32px;line-height:1.2;color:#000}
.c{left:100px;top:500px;width:300px;height:40px}
.c p{font-size:24px;line-height:1.2;color:#000}
</style></head><body><div class="slide">
<div class="tb a"><p>これは重なっている文字の左側です</p></div>
<div class="tb b"><p>これは重なっている文字の右側です</p></div>
<div class="tb c"><p>この長い文章は狭い枠に入りきらないので溢れるはずである</p></div>
</div></body></html>
